name: validate

# 市场质量门禁：SKILL.md 规范、索引一致性、脚本可执行位。
# 检查逻辑见 .github/scripts/validate_marketplace.py，纯标准库，无外部依赖。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 .github/scripts/validate_marketplace.py .
      - run: python3 do-something/tests/test_mr_title_contract.py
